model:
  name: "Qwen/Qwen2-VL-7B-Instruct"
  auto_class: "AutoModelForImageTextToText"   # any transformers Auto* class name
  torch_dtype: "bfloat16"
  # 4-bit quantization is applied only when CUDA + bitsandbytes are available;
  # otherwise the loader warns and falls back to torch_dtype.
  load_in_4bit: true
  compute_dtype: "float16"
  device_map: "auto"
  processor:
    kwargs:                       # forwarded to AutoProcessor.from_pretrained
      min_pixels: 200704          # 256 * 28 * 28
      max_pixels: 401408          # 512 * 28 * 28
    nested_images: false          # true for processors expecting one image list per sample

# Teacher-side generation (hybrid data creation). Used when this model acts as teacher.
generation:
  max_new_tokens: 512
  max_retries: 3          # retries AFTER the first attempt (total attempts = max_retries + 1)
  base_temperature: 0.1
  temperature_step: 0.3   # attempt k uses min(base + k * step, max_temperature)
  max_temperature: 1.0
  top_p: 0.9

# LoRA adapter trained by `original` / `retrain` (MU4Sum: r=8, alpha=16, dropout=0.05 on all linear layers +
# lm_head). Module names depend on the architecture, so they live with the model; override with `lora.r=4`.
# Top-level on purpose: it is not part of the teacher-data fingerprint (only `model` and `generation` are).
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj", "lm_head"]

# Prompt the model receives when it is fine-tuned / unlearned / evaluated (the student). Placeholders: {text},
# {image_types} (own line: dropped when the dataset has `prompt.image_types: false`), {num_images}, {json_example}
# (required: the JSON structure of the answer, built from the aspects asked, exactly as for the teacher).
# Top-level on purpose: it is not part of the teacher-data fingerprint (only `model` and `generation` are).
student_prompt: |-
  You are an expert radiologist.

  You are provided with {num_images} chest X-ray image(s) along with the clinical report: '{text}'.
  Image types, in order: {image_types}.

  Write a concise clinical summary of the images for each aspect listed in the JSON below. Base every summary on the images, stay compatible with the report and do not invent history or patient sex.

  Output ONLY a valid JSON object with one flat text string per aspect (the descriptions below say what each summary must contain), using exactly this structure:

  {json_example}
