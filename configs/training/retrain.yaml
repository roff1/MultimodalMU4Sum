# Retrain: gold standard. A new LoRA adapter trained from the pretrained VLM on the retain aspects only
# (forget/retain aspects come from the dataset preset: `forget_aspects`). Same recipe as `original`.
training:
  method: "retrain"
  epochs: 5
  batch_size: 2
  grad_accum_steps: 1
  lr: 7.0e-5
  weight_decay: 0.0
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  num_workers: 2
  bf16: true
  save_steps: 200           # optimizer steps between checkpoints (final one is always saved)
  log_steps: 10
  keep_last_checkpoints: 2
