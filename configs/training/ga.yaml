# GA: gradient ascent on the forget aspects, starting from the Original adapter. MU4Sum: 300 steps, lr 7e-6.
training:
  method: "ga"              # loss = -forget_nll (retain set unused)
  max_steps: 300            # overrides epochs
  epochs: 1
  eval_steps: 50
  batch_size: 2
  grad_accum_steps: 1
  lr: 7.0e-6
  weight_decay: 0.0
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  num_workers: 2
  bf16: true
  save_steps: 200           # optimizer steps between checkpoints (final one is always saved)
  log_steps: 10
  keep_last_checkpoints: 2
