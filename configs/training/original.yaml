# Original: the starting model. LoRA fine-tuning from the pretrained VLM on the whole training split
# (every aspect, forget and retain alike). All the other methods start from, or are compared to, this one.
# Hyperparameters follow MU4Sum: 5 epochs, lr 7e-5, AdamW, linear schedule with 10% warmup, batch size 2;
# the checkpoint with the lowest validation loss is the final model.
training:
  method: "original"        # key in mu4sum.training.methods.TRAINING_METHODS
  epochs: 5
  batch_size: 2
  grad_accum_steps: 1
  lr: 7.0e-5
  weight_decay: 0.0
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  num_workers: 2
  bf16: true
  save_steps: 200           # optimizer steps between checkpoints (final one is always saved)
  log_steps: 10
  keep_last_checkpoints: 2
