# GA+GD: gradient ascent on the forget aspects + gradient descent on the retain aspects (two views of the same
# records, mixed in each batch; forget samples weigh -1 and retain samples +alpha). MU4Sum: 1 epoch, lr 7e-5.
training:
  method: "ga_gd"           # loss = (-sum forget_nll + alpha * sum retain_nll) / batch size
  alpha: 1.0
  epochs: 1
  batch_size: 2             # samples per batch, forget and retain views mixed
  grad_accum_steps: 1
  lr: 7.0e-5
  weight_decay: 0.0
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  num_workers: 2
  bf16: true
  save_steps: 200           # optimizer steps between checkpoints (final one is always saved)
  log_steps: 10
  keep_last_checkpoints: 2
