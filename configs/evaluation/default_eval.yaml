evaluation:
  metrics:                 # keys in mu4sum.evaluation.metrics.METRICS (MU4Sum reports ROUGE and BERTScore)
    - "rouge"
    - "bertscore"
  batch_size: 8
  num_workers: 2
  save_predictions: true
  limit: null               # debug: only the first N records of each split
  generation:
    max_new_tokens: 256
    temperature: 0.0        # 0 = greedy
  bertscore:
    model_type: "roberta-large"
