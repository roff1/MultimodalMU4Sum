dataset:
  name: "iu_xray"

  # Where raw data comes from. type: kaggle | huggingface | url | local
  source:
    type: "kaggle"
    handle: "masrursabab/iu-chest-x-rays-cleaned"

  # Processor registered with @PROCESSORS.register(...) in mu4sum/preprocessing/processors/<name>.py.
  processor: "iu_xray"

  # Locations inside the downloaded dataset (relative to its root). Check them against the real layout:
  # a wrong path raises an error naming the path it looked for.
  csv_path: "cleaned_dataset.csv"
  images:
    path: "resized_images/{resolution}"   # folder with the images
    resolution: "320"                     # options: 256 | 299 | 320 | 512

  # CSV columns (a missing column raises an error listing the actual ones). One CSV row per image.
  # The record id is the part of the image file name before the first "_" (e.g. CXR3468_IM-1684-0001-0001.png
  # -> CXR3468); rows sharing it are the images of one record.
  columns:
    image: "image_id"            # image file name
    image_type: "projection"     # optional (null = unknown); Frontal / Lateral
    text: "org_caption"          # report text (identical on the rows of a record)

  filtering:
    min_text_chars: 10           # drop records whose text is shorter than this
    images:
      # none            -> keep every record, whatever its images (arbitrary number of images of any type)
      # count           -> keep only records with exactly `count` images
      # count_and_type  -> keep only records whose images are exactly those listed in `types` (type -> how many)
      mode: "none"
      count: 2                   # used by mode "count"
      types:                     # used by mode "count_and_type"; e.g. only Frontal + Lateral pairs
        Frontal: 1
        Lateral: 1

  # Splits are made at record level (never per image) to avoid leakage between images of one record.
  splits:
    train: 0.8
    validation: 0.1
    test: 0.1

# Aspects and their descriptions. They drive both the teacher prompt (hybrid data
# generation) and the student prompts (training / evaluation).
aspects:
  names:
    - "heart_and_mediastinum"
    - "lungs_and_pleura"
    - "bones_soft_tissue_and_devices"
    - "impression"
  descriptions:
    heart_and_mediastinum: "Concise synthesis of cardiac silhouette and mediastinal findings."
    lungs_and_pleura: "Concise synthesis of lung and pleura findings including opacities or effusions."
    bones_soft_tissue_and_devices: "Concise synthesis of bones, soft tissues, and devices."
    impression: "A one-sentence diagnostic summary directly derived from the report."

# Aspects the unlearning experiments forget; every other aspect is retained. Kept outside
# `aspects` on purpose: changing it must not invalidate the teacher-generated data.
forget_aspects: ["impression"]

prompt:
  # Mention the type of each image (CSV `image_type`) in the teacher and student prompts. When false, every
  # prompt line containing {image_types} is dropped.
  image_types: true
  # Single text sent to the teacher. Placeholders:
  #   {text}          the record text
  #   {image_types}   comma-separated image types (put it on a line of its own: the line is dropped if disabled)
  #   {num_images}    number of images of the record
  #   {json_example}  (required) JSON skeleton built from `aspects`: "aspect_summaries" {aspect name: description};
  #                   put it at the end
  teacher_prompt: |-
    You are an expert radiologist.

    You are provided with {num_images} chest X-ray image(s) along with the official clinical report: '{text}'.
    Image types, in order: {image_types}.

    Your task is to analyze both the images and the text to generate a comprehensive and dense clinical profile according to the specified aspects.

    GUIDELINES:

    1. FORMAT: You must output ONLY a valid JSON object. Do not include any conversational text, markdown formatting (like ```json), or explanations outside the JSON block.

    2. VISUAL-TEXTUAL GROUNDING: Your description must be fully supported by the images and compatible with the official report. Describe objective visual elements present in the X-rays even if omitted in the short text report, as long as they do not contradict it. Do not invent external medical history, symptoms, or patient sex.

    3. FLAT TEXT VALUES ONLY: Every value in the JSON must be a single text string. Do not create nested sub-dictionaries inside the keys.

    4. TERMINOLOGY: Leverage precise spatial locations (e.g., 'right lower lobe', 'retrocardiac space'), visual characteristics (e.g., 'patchy opacity', 'increased density'), and medical devices to ensure maximum clinical richness.

    Use the exact following JSON structure:

    {json_example}

# Hybrid-data generation (teacher inference). Teacher model = configs/models/<name>.yaml.
augmentation:
  # false -> `process` is the last stage: its processor must already return `aspect_summaries` and its output
  # takes the standard file names read by training / evaluation. true -> `augment` is the last stage and
  # the `process` output is an intermediate file (process_*).
  enabled: true
  limit: 500                    # debug: only process the first N records
