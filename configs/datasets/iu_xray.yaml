dataset:
  name: "iu_xray"

  # Where raw data comes from. type: kaggle | huggingface | url | local
  source:
    type: "kaggle"
    handle: "masrursabab/iu-chest-x-rays-cleaned"

  # Processor registered in mu4sum.data.processors.PROCESSORS.
  # "grouped_csv": one CSV row per image, rows grouped by study id into a single
  # record holding a variable number of images (e.g. frontal + lateral views).
  processor: "grouped_csv"
  csv_filename: "cleaned_dataset.csv"

  # NOTE: column names below are a best guess for the Kaggle CSV and must be checked
  # against the real file. A missing column raises an error listing the actual ones.
  columns:
    study_id: "uid"
    image: "filename"
    projection: "projection"     # optional (set to null if absent); used to order views
    report:                      # report-field name -> CSV column (used as teacher context)
      findings: "findings"
      impression: "impression"

  images:
    resolution: "320"            # options: 256 | 299 | 320 | 512
    search_subdir: "{resolution}" # sub-folder of the raw root holding images (null = whole root)

  filtering:
    min_report_chars: 10
    view_order: ["Frontal", "Lateral"]

  # Splits are made at STUDY level (never per image) to avoid leakage between views.
  splits:
    train: 0.8
    validation: 0.1
    test: 0.1

# Aspects and their descriptions. They drive both the teacher prompt (hybrid data
# generation) and the student prompts (fine-tuning / unlearning / evaluation).
aspects:
  names:
    - "heart_and_mediastinum"
    - "lungs_and_pleura"
    - "bones_soft_tissue_and_devices"
    - "impression"
  descriptions:
    heart_and_mediastinum: "Concise synthesis of cardiac silhouette and mediastinal findings."
    lungs_and_pleura: "Concise synthesis of lung and pleura findings including opacities or effusions."
    bones_soft_tissue_and_devices: "Concise synthesis of bones, soft tissues, and devices."
    impression: "A one-sentence diagnostic summary directly derived from the report."

# Aspects the unlearning experiments forget; every other aspect is retained. Kept outside
# `aspects` on purpose: changing it must not invalidate the teacher-generated data.
forget_aspects: ["impression"]

prompt:
  # incremental: aspect descriptions are shown to the models (student prompt: "Aspect i/N: name" +
  #              description; teacher JSON template: the description as placeholder value).
  # names_only:  aspects are given by key only (no descriptions).
  mode: "incremental"
  teacher_system: "You are an expert radiologist. You answer only with valid JSON."
  # Teacher prompt = teacher_intro + generic output rules + JSON template built from `aspects`
  # (and `expansion`). Placeholders available in teacher_intro:
  #   {image_info}  -> built per study from the number/views of its images, e.g. "Image 1 (Frontal) and Image 2 (Lateral)"
  #   {source_text} -> the dataset text of the study (leave the placeholder out to not show it to the teacher)
  teacher_intro: |-
    You are provided with the following chest X-ray image(s): {image_info}, along with the official clinical report: '{source_text}'.

    Your task is to analyze both the images and the text to generate a comprehensive, highly detailed, and dense textual profile, synthesizing the visual evidence with the textual ground truth.

    VISUAL-TEXTUAL GROUNDING: Your output must be fully supported by the images and compatible with the official report. You should describe objective visual elements present in the X-rays even if they are omitted in the short text report, as long as they do not contradict the report. Do not invent external medical history, symptoms, or the patient's sex.

    TERMINOLOGY & EXAMPLES: When describing findings, leverage precise spatial locations (e.g., 'right lower lobe', 'retrocardiac space', 'costophrenic angle'), visual characteristics (e.g., 'patchy opacity', 'increased density', 'blunting', 'radiolucency'), and objective hardware or medical devices (e.g., pacemakers or tubes) to ensure maximum clinical richness.
  # Also ask the teacher to expand the dataset text; stored in the hybrid records as `expanded_text`.
  expansion:
    enabled: true
    description: "Write a fluent, dense descriptive paragraph of 70-90 words synthesizing the visual findings and the official report, detailing anatomical structures, spatial positions, and medical devices without fabricating external history or patient sex"
  student_task: >-
    Look at the chest X-ray image(s) and write the summary for the following aspect(s).

# Hybrid-data generation (teacher inference). Teacher model = configs/models/<name>.yaml.
augmentation:
  limit: null                    # debug: only process the first N studies
