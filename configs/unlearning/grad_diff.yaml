unlearning:
  method: "grad_diff"       # key in mu4sum.unlearning.methods.UNLEARNING_METHODS
  # loss = -forget_nll + alpha * retain_nll
  alpha: 1.0
  # forget/retain aspects come from the dataset preset (`forget_aspects`)
  batch_size: 4            # per side: each micro-batch holds batch_size forget + batch_size retain samples
  grad_accum_steps: 2
  epochs: 1
  lr: 1.0e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  num_workers: 2
  bf16: true
  save_steps: 100
  log_steps: 5
  keep_last_checkpoints: 2
