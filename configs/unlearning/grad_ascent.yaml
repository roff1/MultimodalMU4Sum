unlearning:
  method: "grad_ascent"     # loss = -forget_nll (retain set unused)
  alpha: 0.0
  # forget/retain aspects come from the dataset preset (`forget_aspects`)
  batch_size: 4
  grad_accum_steps: 2
  epochs: 1
  lr: 1.0e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  num_workers: 2
  bf16: true
  save_steps: 100
  log_steps: 5
  keep_last_checkpoints: 2
