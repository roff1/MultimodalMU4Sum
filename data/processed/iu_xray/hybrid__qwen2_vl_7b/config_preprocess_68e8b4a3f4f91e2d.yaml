seed: 42
deterministic: true
runtime:
  environment: COLAB
  data_root: /content/MultimodalMU4Sum/data
  output_root: /content/MultimodalMU4Sum/outputs
dataset:
  name: iu_xray
  source:
    type: kaggle
    handle: masrursabab/iu-chest-x-rays-cleaned
  processor: iu_xray
  csv_path: cleaned_dataset.csv
  images:
    path: resized_images/{resolution}
    resolution: '320'
  columns:
    image: image_id
    image_type: projection
    text: org_caption
  filtering:
    min_text_chars: 10
    images:
      mode: none
      count: 2
      types:
        Frontal: 1
        Lateral: 1
  splits:
    train: 0.8
    validation: 0.1
    test: 0.1
aspects:
  names:
  - heart_and_mediastinum
  - lungs_and_pleura
  - bones_soft_tissue_and_devices
  - impression
  descriptions:
    heart_and_mediastinum: Concise synthesis of cardiac silhouette and mediastinal
      findings.
    lungs_and_pleura: Concise synthesis of lung and pleura findings including opacities
      or effusions.
    bones_soft_tissue_and_devices: Concise synthesis of bones, soft tissues, and devices.
    impression: A one-sentence diagnostic summary directly derived from the report.
forget_aspects:
- impression
prompt:
  image_types: true
  teacher_prompt: 'You are an expert radiologist.


    You are provided with {num_images} chest X-ray image(s) along with the official
    clinical report: ''{text}''.

    Image types, in order: {image_types}.


    Your task is to analyze both the images and the text to generate a comprehensive
    and dense clinical profile according to the specified aspects.


    GUIDELINES:


    1. FORMAT: You must output ONLY a valid JSON object. Do not include any conversational
    text, markdown formatting (like ```json), or explanations outside the JSON block.


    2. VISUAL-TEXTUAL GROUNDING: Your description must be fully supported by the images
    and compatible with the official report. Describe objective visual elements present
    in the X-rays even if omitted in the short text report, as long as they do not
    contradict it. Do not invent external medical history, symptoms, or patient sex.


    3. FLAT TEXT VALUES ONLY: Every value in the JSON must be a single text string.
    Do not create nested sub-dictionaries inside the keys.


    4. TERMINOLOGY: Leverage precise spatial locations (e.g., ''right lower lobe'',
    ''retrocardiac space''), visual characteristics (e.g., ''patchy opacity'', ''increased
    density''), and medical devices to ensure maximum clinical richness.


    Use the exact following JSON structure:


    {json_example}'
augmentation:
  limit: 500
model:
  name: Qwen/Qwen2-VL-7B-Instruct
  auto_class: AutoModelForImageTextToText
  torch_dtype: bfloat16
  load_in_4bit: true
  compute_dtype: float16
  device_map: auto
  processor:
    kwargs:
      min_pixels: 200704
      max_pixels: 401408
    nested_images: false
generation:
  max_new_tokens: 512
  max_retries: 3
  base_temperature: 0.1
  temperature_step: 0.3
  max_temperature: 1.0
  top_p: 0.9
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - lm_head
student_prompt: 'You are an expert radiologist.


  You are provided with {num_images} chest X-ray image(s) along with the clinical
  report: ''{text}''.

  Image types, in order: {image_types}.


  Write a concise clinical summary of the images for each aspect listed in the JSON
  below. Base every summary on the images, stay compatible with the report and do
  not invent history or patient sex.


  Output ONLY a valid JSON object with one flat text string per aspect (the descriptions
  below say what each summary must contain), using exactly this structure:


  {json_example}'
run:
  operation: preprocess
  model: qwen2_vl_7b
  teacher: qwen2_vl_7b
  dataset: iu_xray
  method: null
  tag: null
  original_tag: null
  eval_tag: null
